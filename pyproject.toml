[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-fairy"
dynamic = ["version"]
description = "Config-driven file sync CLI: copy named groups of files from a source project to a target project on local disk, with plan/apply/status and checksum-based drift tracking."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Christopher Steel" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
file-fairy = "file_fairy:main"
ff = "file_fairy:main"

[tool.setuptools]
py-modules = ["file_fairy"]

[tool.setuptools.dynamic]
# VERSION is authoritative, per the release ceremony; read it rather
# than duplicating it here, where it drifted to 0.1.0 by 0.5.0.
version = { file = "VERSION" }
